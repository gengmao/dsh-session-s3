# Bundle patch: replace the profile's `sessions` row with this S3 backend.
#
#   dsh plugin --profile web add github:gengmao/dsh-session-s3
#
# This file is plain YAML (no !!js tags). After install, set bucket / region /
# endpoint in the profile overlay ($DSH_HOME/profiles/<name>/cordis.patch.yml)
# or pass them as plugin config. Leave accessKeyId / secretAccessKey unset so
# the AWS SDK default chain (shared credentials, AWS_PROFILE, SSO, IAM role)
# can supply session tokens.
#
# Identifiers:
#   profile slot id  = sessions          (replaces dsh-session-persistence-jsonl)
#   plugin package   = dsh-session-s3
#   cordis.yml id    = dsh-session-persistence-s3
#   Cordis service   = sessionPersistence  (ctx.sessionPersistence)

- id: sessions
  name: dsh-session-s3
  config:
    bucket: my-sessions
    prefix: dsh/
    region: auto
    flushThresholdEvents: 50
    flushThresholdBytes: 262144
