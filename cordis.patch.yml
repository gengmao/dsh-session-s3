# Bundle patch: replace the profile's `sessions` row with this S3 backend.
#
#   dsh plugin --profile web add github:gengmao/dsh-session-s3
#
# Leave accessKeyId / secretAccessKey unset so the AWS SDK default chain
# (shared credentials, AWS_PROFILE, SSO, IAM role) can supply session tokens.
# Static keys in this file skip AWS_SESSION_TOKEN and break SSO / assume-role.
#
# Override bucket / region / endpoint in the profile cordis.patch.yml, or set:
#   DSH_S3_BUCKET, DSH_S3_PREFIX, DSH_S3_REGION, DSH_S3_ENDPOINT
#
# Caveat: this plugin currently exposes SessionPersistenceProvider
# (load/append/read/compact/close), not the full upstream SessionPersistence
# abstract class. Reconcile before using it as a drop-in for
# @deepseek-ai/dsh-session-persistence-jsonl.

- id: sessions
  name: dsh-session-s3
  config:
    bucket: !!js process.env.DSH_S3_BUCKET
    prefix: !!js process.env.DSH_S3_PREFIX ?? 'dsh/'
    region: !!js process.env.DSH_S3_REGION ?? 'auto'
    endpoint: !!js process.env.DSH_S3_ENDPOINT
    forcePathStyle: !!js process.env.DSH_S3_ENDPOINT !== undefined
    flushThresholdEvents: 50
    flushThresholdBytes: 262144
